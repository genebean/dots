name: Validate

on:
  pull_request:
  schedule:
    # Weekly full sweep after Thursday's dependency update window.
    - cron: "0 12 * * 5"
  workflow_dispatch:

env:
  # This repository's flake.nix declares the public binary caches and signing
  # keys needed by its inputs. CI is non-interactive, so explicitly accept
  # those checked-in settings rather than silently ignoring them.
  NIX_CONFIG: |
    accept-flake-config = true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: false

      - name: Check formatting
        run: nix fmt -- --ci .

      - name: Run deadnix
        run: nix run nixpkgs#deadnix -- ./modules ./lib

      - name: Run statix
        run: nix run nixpkgs#statix -- check .

      - name: Check restic prune singleton
        run: scripts/check-restic-prune-singleton.sh

      - name: Run ruff check
        run: nix run nixpkgs#ruff -- check .

      - name: Run ruff format check
        run: nix run nixpkgs#ruff -- format --check --diff .

  nixos:
    name: Build ${{ matrix.host }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host:
          - nixnuc
          - hetznix01
    steps:
      - uses: actions/checkout@v7
      - name: Read pinned private flake revision
        id: private-flake
        run: echo "rev=$(jq -r '.nodes[.nodes.root.inputs["private-flake"]].locked.rev' flake.lock)" >> "$GITHUB_OUTPUT"
      - name: Checkout pinned private flake
        uses: actions/checkout@v7
        with:
          repository: genebean/private-flake
          ref: ${{ steps.private-flake.outputs.rev }}
          token: ${{ secrets.CI_PRIVATE_FLAKE_READ }}
          path: private-flake
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: false
      - name: Build NixOS configuration
        run: nix build .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel --override-input private-flake path:$GITHUB_WORKSPACE/private-flake

  extended-nixos:
    name: Build ${{ matrix.host }} (full sweep)
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: bigboy
            configuration: bigboy-ci
            runner: ubuntu-latest
          - host: hetznix02
            configuration: hetznix02
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Read pinned private flake revision
        id: private-flake
        run: echo "rev=$(jq -r '.nodes[.nodes.root.inputs["private-flake"]].locked.rev' flake.lock)" >> "$GITHUB_OUTPUT"
      - name: Checkout pinned private flake
        uses: actions/checkout@v7
        with:
          repository: genebean/private-flake
          ref: ${{ steps.private-flake.outputs.rev }}
          token: ${{ secrets.CI_PRIVATE_FLAKE_READ }}
          path: private-flake
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: false
      - name: Build NixOS configuration
        run: nix build .#nixosConfigurations.${{ matrix.configuration }}.config.system.build.toplevel --override-input private-flake path:$GITHUB_WORKSPACE/private-flake

  home-manager:
    name: Build Home Manager (x86_64 Linux)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read pinned private flake revision
        id: private-flake
        run: echo "rev=$(jq -r '.nodes[.nodes.root.inputs["private-flake"]].locked.rev' flake.lock)" >> "$GITHUB_OUTPUT"
      - name: Checkout pinned private flake
        uses: actions/checkout@v7
        with:
          repository: genebean/private-flake
          ref: ${{ steps.private-flake.outputs.rev }}
          token: ${{ secrets.CI_PRIVATE_FLAKE_READ }}
          path: private-flake
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: false
      - name: Build Home Manager configuration
        run: nix build .#homeConfigurations.gene-x86_64-linux.activationPackage --override-input private-flake path:$GITHUB_WORKSPACE/private-flake

  mightymac:
    name: Build mightymac (Apple Silicon)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Read pinned private flake revision
        id: private-flake
        run: echo "rev=$(jq -r '.nodes[.nodes.root.inputs["private-flake"]].locked.rev' flake.lock)" >> "$GITHUB_OUTPUT"
      - name: Checkout pinned private flake
        uses: actions/checkout@v7
        with:
          repository: genebean/private-flake
          ref: ${{ steps.private-flake.outputs.rev }}
          token: ${{ secrets.CI_PRIVATE_FLAKE_READ }}
          path: private-flake
      - uses: DeterminateSystems/nix-installer-action@v22
      - name: Build nix-darwin configuration
        run: nix build .#darwinConfigurations.mightymac-ci.system --override-input private-flake path:$GITHUB_WORKSPACE/private-flake
